[project]
name = "bihar-rozgar-backend"
version = "0.1.0"
description = "FastAPI backend scaffold for Bihar Rozgar with async PostgreSQL and AI-ready modules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "greenlet>=3.0.3",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyJWT>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
